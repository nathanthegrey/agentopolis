# The COMPANY app: it is also the ceo's identity (its direct message is the ceo's chat).
# It owns the slash commands, the Home tab and every app-identity card. One per workspace.
# Create or update it at api.slack.com/apps → App Manifest → paste → Save → Reinstall.
display_information:
  name: Jarvis
  description: "CEO of Agentopolis: talk to him about anything concerning the company"
  background_color: "#1f2933"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Jarvis
    always_online: true
  slash_commands:
    - command: /agentopolis
      description: Apri il pannello dell'azienda
      should_escape: false
    - command: /hire
      description: Assumi un agente
      should_escape: false
    - command: /edit
      description: Modifica un agente (AGENT.md o MEMORY.md)
      usage_hint: "<agente>"
      should_escape: false
    - command: /diag
      description: Ultimo turno di un agente
      usage_hint: "<agente>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - commands
      - groups:write
      - groups:history
      - groups:read
      - channels:manage
      - channels:history
      - channels:read
      - im:history
      - im:write
      - im:read
      - reactions:read
      - users:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - reaction_added
      - app_home_opened
      - member_joined_channel
      - channel_archive
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
