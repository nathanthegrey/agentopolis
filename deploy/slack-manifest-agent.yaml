# A STANDING AGENT app (one per lead; the ceo uses the company app). Replace NAME twice.
# No slash commands (they belong to the company app), no Home tab. Its direct message is the
# owner's chat with this agent; it posts in its project's channels and threads as itself.
display_information:
  name: NAME
  description: Agente di Agentopolis
  background_color: "#1f2933"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: NAME
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - groups:write
      - groups:history
      - groups:read
      - channels:manage
      - channels:history
      - channels:read
      - im:history
      - im:write
      - im:read
      - reactions:read
      - users:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - reaction_added
      - member_joined_channel
      - channel_archive
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
